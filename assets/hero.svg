<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Maram Rzeigui, élève ingénieure Mobile, Full Stack et IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080b"/>
      <stop offset="0.6" stop-color="#120c10"/>
      <stop offset="1" stop-color="#22090e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#E5545F" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#B83A46" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#B83A46" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffd2d6"/>
      <stop offset="0.25" stop-color="#E5545F"/>
      <stop offset="0.7" stop-color="#7a1622"/>
      <stop offset="1" stop-color="#1a0408"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffb3b9"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5545F" stop-opacity="0"/>
      <stop offset="1" stop-color="#E5545F" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="floor"><rect x="0" y="300" width="1200" height="140"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter><filter id="halo" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="34"/></filter>
    <style>
      .t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .role{opacity:0;animation:role 9s infinite}
      .r2{animation-delay:3s}.r3{animation-delay:6s}
      @keyframes role{0%{opacity:0;transform:translateY(10px)}6%,30%{opacity:1;transform:translateY(0)}36%,100%{opacity:0;transform:translateY(-8px)}}
      .chip{animation:float 6s ease-in-out infinite}
      .c2{animation-delay:-1.5s}.c3{animation-delay:-3s}.c4{animation-delay:-4.5s}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      .pulse{animation:pulse 3s ease-in-out infinite;transform-origin:930px 190px}
      @keyframes pulse{0%,100%{opacity:.28;transform:scale(1)}50%{opacity:.45;transform:scale(1.1)}}
      .scan{animation:scan 2.2s linear infinite}
      @keyframes scan{from{transform:translateY(0)}to{transform:translateY(28px)}}
      .caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="440" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="22" fill="url(#glow)"/>

  <!-- sol en perspective, qui défile -->
  <g clip-path="url(#floor)" stroke="#E5545F" stroke-opacity="0.22">
    <g class="scan">
      <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="312" x2="1200" y2="312"/>
      <line x1="0" y1="328" x2="1200" y2="328"/><line x1="0" y1="350" x2="1200" y2="350"/>
      <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="414" x2="1200" y2="414"/>
      <line x1="0" y1="458" x2="1200" y2="458"/>
    </g>
    <path d="M600 300L-600 440M600 300L-200 440M600 300L100 440M600 300L360 440M600 300L600 440M600 300L840 440M600 300L1100 440M600 300L1400 440M600 300L1800 440"/>
  </g>
  <rect x="0" y="296" width="1200" height="8" fill="#E5545F" opacity="0.18" filter="url(#blur)"/>

  <!-- sphère et orbites 3D -->
  <circle cx="930" cy="190" r="105" fill="#E5545F" filter="url(#halo)" class="pulse"/>
  <g transform="translate(930 190)">
    <g>
      <ellipse rx="190" ry="58" fill="none" stroke="#E5545F" stroke-opacity="0.35" stroke-width="1.5" transform="rotate(-18)"/>
      <ellipse rx="160" ry="44" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1" transform="rotate(28)"/>
      <ellipse rx="215" ry="72" fill="none" stroke="#E5545F" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 10" transform="rotate(8)">
        <animate attributeName="stroke-dashoffset" values="0;-140" dur="6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <circle r="78" fill="url(#sphere)"/>
    <ellipse rx="78" ry="20" fill="none" stroke="#ffffff" stroke-opacity="0.25" transform="rotate(-18)"/>
    <ellipse cx="-24" cy="-30" rx="26" ry="14" fill="#ffffff" opacity="0.28" transform="rotate(-30)"/>
    <!-- éclair Volteo -->
    <path d="M10 -40 L-18 6 L2 6 L-10 42 L22 -6 L2 -6 Z" fill="#ffffff" opacity="0.92"/>
    <!-- satellites -->
    <g transform="rotate(-18)"><circle r="7" fill="#ffffff"><animateMotion dur="7s" repeatCount="indefinite" path="M190,0 A190,58 0 1,1 -190,0 A190,58 0 1,1 190,0"/></circle></g>
    <g transform="rotate(28)"><circle r="5" fill="#E5545F"><animateMotion dur="5s" repeatCount="indefinite" path="M-160,0 A160,44 0 1,0 160,0 A160,44 0 1,0 -160,0"/></circle></g>
    <g transform="rotate(8)"><circle r="4" fill="#ffb3b9"><animateMotion dur="9s" repeatCount="indefinite" path="M215,0 A215,72 0 1,1 -215,0 A215,72 0 1,1 215,0"/></circle></g>
  </g>

  <!-- technologies flottantes -->
  <g class="t" font-size="15" font-weight="600">
    <g class="chip"><rect x="700" y="62" rx="15" width="132" height="30" fill="#ffffff" fill-opacity="0.06" stroke="#E5545F" stroke-opacity="0.5"/><text x="766" y="82" text-anchor="middle" fill="#ffd0d4">React Native</text></g>
    <g class="chip c2"><rect x="1062" y="96" rx="15" width="96" height="30" fill="#ffffff" fill-opacity="0.06" stroke="#E5545F" stroke-opacity="0.5"/><text x="1110" y="116" text-anchor="middle" fill="#ffd0d4">Flutter</text></g>
    <g class="chip c3"><rect x="1050" y="262" rx="15" width="112" height="30" fill="#ffffff" fill-opacity="0.06" stroke="#E5545F" stroke-opacity="0.5"/><text x="1106" y="282" text-anchor="middle" fill="#ffd0d4">LLM · OCR</text></g>
    <g class="chip c4"><rect x="704" y="268" rx="15" width="120" height="30" fill="#ffffff" fill-opacity="0.06" stroke="#E5545F" stroke-opacity="0.5"/><text x="764" y="288" text-anchor="middle" fill="#ffd0d4">Kafka · ML</text></g>
  </g>

  <!-- texte -->
  <g class="t">
    <text x="70" y="96" fill="#E5545F" font-size="15" font-weight="700" letter-spacing="4">ÉLÈVE INGÉNIEURE · ESPRIT · SIM</text>
    <text x="66" y="172" fill="url(#name)" font-size="74" font-weight="800" letter-spacing="-2">Maram Rzeigui</text>
    <rect x="70" y="194" width="86" height="4" rx="2" fill="#E5545F"/>
    <g font-size="26" font-weight="600" fill="#e9e9ee">
      <text class="role" x="70" y="246">Applications mobiles natives &amp; cross-platform</text>
      <text class="role r2" x="70" y="246">IA appliquée : LLM locaux, OCR, ML temps réel</text>
      <text class="role r3" x="70" y="246">Produits complets, du cahier des charges à la prod</text>
    </g>
    <text x="70" y="282" fill="#9a9aa6" font-size="17">Mobile · Full Stack · Data &amp; IA — à la recherche d’un PFE de 6 mois<tspan class="caret" fill="#E5545F"> ▍</tspan></text>
  </g>
</svg>
