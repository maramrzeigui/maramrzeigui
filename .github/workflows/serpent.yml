name: Serpent des contributions
on:
  schedule: [{ cron: "0 4 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpent.svg?palette=github-dark&color_snake=#E5545F&color_dots=#161b22,#4a1c22,#7a2a33,#B83A46,#E5545F
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
